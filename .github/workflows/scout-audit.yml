name: Scout Security Audit

on:
  pull_request:
    paths:
      - "apps/contracts/**/*.rs"
      - "apps/contracts/**/Cargo.toml"
  push:
    branches: [main]
    paths:
      - "apps/contracts/**"

permissions:
  contents: read
  security-events: write

jobs:
  scout:
    name: Scout Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/contracts

      - name: Install cargo-scout-audit
        run: cargo install cargo-scout-audit --locked
        continue-on-error: true

      - name: Run Scout
        run: |
          if command -v cargo-scout-audit > /dev/null 2>&1; then
            cargo scout-audit --output-format sarif --output-path scout-results.sarif || true
          fi
          if [ ! -f scout-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[]}' > scout-results.sarif
          fi

      - name: Upload results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: apps/contracts/scout-results.sarif

      # Uncomment when ready to block PRs on findings:
      # - name: Fail on vulnerabilities
      #   run: cargo scout-audit
