name: Scout Security Audit

on:
  pull_request:
    paths:
      - "apps/contracts/**/*.rs"
      - "apps/contracts/**/Cargo.toml"
  push:
    branches: [main]
    paths:
      - "apps/contracts/**"

permissions:
  contents: read
  security-events: write

jobs:
  scout:
    name: Scout Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/contracts

      - name: Install cargo-scout-audit
        run: cargo install cargo-scout-audit --locked
        continue-on-error: true

      - name: Run Scout
        run: |
          SARIF_PATH="$(pwd)/scout-results.sarif"
          # GitHub upload-sarif requires runs to be non-empty
          EMPTY_SARIF='{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"cargo-scout-audit","informationUri":"https://github.com/CoinFabrik/scout","rules":[]}},"results":[]}]}'

          if command -v cargo-scout-audit > /dev/null 2>&1; then
            cargo scout-audit --output-format sarif --output-path "$SARIF_PATH" || true
          fi

          # Replace with valid fallback if JSON is invalid OR runs array is empty
          python3 -c "
import json, sys
path, fallback = sys.argv[1], sys.argv[2]
try:
    data = json.load(open(path))
    if not data.get('runs'):
        raise ValueError('empty runs')
except Exception:
    open(path, 'w').write(fallback)
" "$SARIF_PATH" "$EMPTY_SARIF" 2>/dev/null || echo "$EMPTY_SARIF" > "$SARIF_PATH"

      - name: Upload results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: apps/contracts/scout-results.sarif

      # Uncomment when ready to block PRs on findings:
      # - name: Fail on vulnerabilities
      #   run: cargo scout-audit
